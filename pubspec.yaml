name: app_diceprojects_admin
description: DiceProjects Admin - Panel de administracion movil Flutter
publish_to: "none"
version: 1.0.6+43
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1
  uuid: ^4.4.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  app_links: ^6.3.3
  local_auth: ^2.3.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
